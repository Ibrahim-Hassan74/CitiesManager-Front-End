<div class="flex justify-center items-center min-h-[60vh]">
  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold text-center text-purple-700 mb-6">Login</h2>
    <form id="loginForm" class="space-y-4">
      <div>
        <label for="email" class="block mb-1 text-gray-700 font-medium"
          >Email</label
        >
        <input
          type="email"
          id="email"
          class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
          placeholder="you@example.com"
          required
        />
      </div>

      <div>
        <label for="password" class="block mb-1 text-gray-700 font-medium"
          >Password</label
        >
        <input
          type="password"
          id="password"
          class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
          placeholder="••••••••"
          required
        />
      </div>

      <button
        type="submit"
        class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-lg transition-all duration-200"
      >
        Sign In
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-4">
      Don't have an account?
      <a href="#register" class="text-purple-600 hover:underline"> Sign up </a>
    </p>
  </div>
</div>
