<div class="flex justify-center items-center">
  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-2xl">
    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">
      Search for a City
    </h2>

    <div class="flex space-x-4">
      <input
        type="text"
        id="searchInput"
        placeholder="Enter city name..."
        class="flex-1 px-5 py-3 rounded-lg text-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500"
      />
      <button
        id="searchButton"
        class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-lg text-lg transition duration-300"
      >
        Search
      </button>
    </div>
  </div>
</div>
