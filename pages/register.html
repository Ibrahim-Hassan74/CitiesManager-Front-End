<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md mt-10">
  <h2 class="text-2xl font-bold mb-6 text-center text-purple-700">Register</h2>
  <form id="registerForm" class="space-y-4">
    <input
      type="text"
      id="name"
      placeholder="Full Name"
      class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500"
      required
    />
    <input
      type="email"
      id="email"
      placeholder="Email"
      class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500"
      required
    />
    <input
      type="tel"
      id="phone"
      placeholder="Phone Number"
      class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500"
      required
    />
    <input
      type="password"
      id="password"
      placeholder="Password"
      class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500"
      required
    />
    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirm Password"
      class="w-full p-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500"
      required
    />
    <button
      type="submit"
      class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-3 rounded-xl transition-all duration-200"
    >
      Register
    </button>
    <div
      id="registerMessage"
      class="text-center text-sm text-red-500 mt-2"
    ></div>
  </form>
</div>
