<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cities Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-white shadow-md px-6 py-4">
      <div class="max-w-6xl mx-auto flex justify-between items-center">
        <!-- Logo / Brand -->
        <div class="text-2xl font-bold text-purple-700 flex items-center gap-2">
          <span class="text-3xl">🌆</span> Cities Manager
        </div>

        <ul class="hidden md:flex space-x-6 text-gray-700 font-medium">
          <li>
            <button
              onclick="loadPage('index.html')"
              class="hover:text-purple-600 transition duration-200"
            >
              Home
            </button>
          </li>
          <li>
            <button
              onclick="location.hash = 'cities'"
              class="hover:text-purple-600 transition duration-200"
            >
              Cities
            </button>
          </li>
          <li id="loginNav">
            <button
              onclick="location.hash = 'login'"
              class="hover:text-purple-600 transition duration-200"
            >
              Login
            </button>
          </li>
          <li id="registerNav">
            <button
              onclick="location.hash = 'register'"
              class="hover:text-purple-600 transition duration-200"
            >
              Register
            </button>
          </li>
          <li id="logoutNav" class="hidden">
            <button
              onclick="logout()"
              class="text-red-500 hover:text-red-700 transition duration-200"
            >
              Logout
            </button>
          </li>
        </ul>

        <button
          class="md:hidden text-purple-600 hover:text-purple-800 focus:outline-none"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
      </div>
    </nav>

    <main id="content" class="flex-1 p-6 max-w-6xl mx-auto w-full"></main>

    <footer
      class="bg-white text-center py-4 shadow-inner mt-6 text-sm text-gray-500"
    >
      © 2025 Cities Manager. All rights reserved.
    </footer>

    <script src="layout.js"></script>
    <script src="script.js"></script>
  </body>
</html>
